<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Our online courses</title>
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<main class="page">
			<section class="courses" aria-labelledby="courses-title">
				<div class="courses__shapes">
					<div class="courses__shape courses__shape_1">
						<img src="./assets/images/shapes/shape-1.svg" alt="" />
					</div>
					<div class="courses__shape courses__shape_2">
						<img src="./assets/images/shapes/shape-2.svg" alt="" />
					</div>
					<div class="courses__shape courses__shape_3">
						<img src="./assets/images/shapes/shape-3.svg" alt="" />
					</div>
				</div>
				<div class="courses__container">
					<header class="courses__header">
						<p class="courses__eyebrow">ENJOY YOUR STUDYING!</p>
						<h1 class="courses__title" id="courses-title">Our online courses</h1>
					</header>

					<div class="courses__controls">
						<div class="filters" data-filters>
							<div
								class="filters__list"
								role="tablist"
								aria-label="Категории курсов"
								data-filters-list></div>
						</div>

						<div class="search">
							<label class="search__label" for="course-search">Search</label>
							<div class="search__field">
								<input
									class="search__input"
									id="course-search"
									type="search"
									placeholder="Search course..."
									autocomplete="off"
									inputmode="search"
									aria-label="Search course"
									data-search-input />
								<span class="search__icon" aria-hidden="true"></span>
							</div>
						</div>
					</div>

					<div class="courses__content">
						<div class="courses__grid" aria-live="polite" data-courses-grid></div>
						<div class="courses__empty" hidden data-empty>
							<p class="courses__empty-title">No courses found</p>
							<p class="courses__empty-text">Try changing the query or filter.</p>
						</div>
					</div>

					<div class="courses__footer">
						<button class="courses__load-more" type="button" data-load-more>
							<span class="courses__load-more-icon" aria-hidden="true"
								><svg
									width="22"
									height="20"
									viewBox="0 0 22 20"
									fill="none"
									xmlns="http://www.w3.org/2000/svg">
									<path
										fill-rule="evenodd"
										clip-rule="evenodd"
										d="M1 0C1.55228 0 2 0.447715 2 1V5.43632C3.65803 2.20928 7.01998 0 10.9 0C15.2556 0 18.9584 2.78413 20.3307 6.66675C20.5147 7.18747 20.2418 7.75879 19.7211 7.94284C19.2004 8.12689 18.6291 7.85396 18.445 7.33325C17.3463 4.22472 14.3817 2 10.9 2C7.93996 2 5.35365 3.60799 3.96994 6H6.99996C7.55225 6 7.99996 6.44772 7.99996 7C7.99996 7.55228 7.55225 8 6.99996 8H1C0.447715 8 0 7.55228 0 7V1C0 0.447715 0.447715 0 1 0Z"
										fill="#424551" />
									<path
										fill-rule="evenodd"
										clip-rule="evenodd"
										d="M2.07703 12.0572C2.59775 11.8731 3.16907 12.146 3.35312 12.6668C4.45183 15.7753 7.41647 18 10.8982 18C13.8582 18 16.4445 16.392 17.8282 14H14.7982C14.2459 14 13.7982 13.5523 13.7982 13C13.7982 12.4477 14.2459 12 14.7982 12H20.7981C21.3504 12 21.7981 12.4477 21.7981 13V19C21.7981 19.5523 21.3504 20 20.7981 20C20.2459 20 19.7981 19.5523 19.7981 19V14.5637C18.1401 17.7907 14.7782 20 10.8982 20C6.54254 20 2.83975 17.2159 1.46744 13.3332C1.28339 12.8125 1.55632 12.2412 2.07703 12.0572Z"
										fill="#424551" />
								</svg>
							</span>
							<span class="courses__load-more-text">Load more</span>
						</button>
					</div>
				</div>

				<template id="filter-template">
					<button class="filters__button" type="button" role="tab">
						<span class="filters__label"></span>
						<span class="filters__count"></span>
					</button>
				</template>

				<template id="course-card-template">
					<article class="card">
						<div class="card__image-wrap">
							<img class="card__image" alt="" loading="lazy" />
						</div>
						<div class="card__body">
							<span class="card__tag"></span>
							<h3 class="card__title"></h3>
							<p class="card__meta">
								<span class="card__price"></span>
								<span class="card__by">by</span>
								<span class="card__author"></span>
							</p>
						</div>
					</article>
				</template>
			</section>
		</main>

		<script type="module" src="./js/main.js"></script>
	</body>
</html>
